# Reads the configured county burn lines BY HAND and PUSHES the readings to The
# Grid. It has no schedule: the daily read is a scheduled task in the hosting
# account, running the same command from the Dockerfile's `burn-line` image at
# 06:00 Pacific (docs/deploy-handoff.md, "The burn line task"). This workflow
# had an hourly cron until 2026-11; GitHub started about 3 of its 15 runs a
# day, hours late, which is why the read moved.
#
# Use it to force a fresh read (a plain run always dials every enabled line),
# to retry one line (`line`), or to test without pushing (`dry_run`). It uses
# the repository's own copies of the credentials; the ingest token is the
# same token the scheduled task holds, so a rotation replaces both.
#
# The dialing never lives in the server: placing a phone call costs money and
# a long-running server would re-dial on every restart or deploy. The server
# only ever receives the result, on the shared push-ingest endpoint as the
# `burn.line` stream.
#
# GRID_INGEST_ENDPOINT is the full stream URL, e.g.
# https://data.sierragridteam.org/api/v1/ingest/burn.line; the repo secret
# BURNLINE_INGEST_TOKEN is the `burn-line` grid.ingest reporter's token
# (`make ingest-token REPORTER=burn-line STREAMS=burn.line`), granted only that
# stream. Named per reporter so other push reporters can get their own.
#
# Before dialing, the tool preflights the endpoint (`?preflight=true`): a bad
# token, a missing grant or a server outage fails the run before any paid call.
#
# A failed line pushes NOTHING — deliberately. The tool retries it a few times
# in-run (the usual failure is the line answering "busy"), then leaves it to the
# next run. If it is never read, the previous reading ages past the
# server's freshness gate (grid.burn.burnDayStaleAfter, 36h) and the burn-day
# facet reads UNKNOWN, which consumers render as "call the line".
name: Burn line

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Call and extract, but do not push"
        type: boolean
        default: false
      line:
        description: "Dial only this line id (default: every enabled line)"
        type: string
        required: false
      not_before:
        description: "Pacific HH:MM. Dial nothing before it and skip lines already read since it today (empty always dials)"
        type: string
        required: false

# Never two runs of this workflow at once: overlapping runs would dial every
# line twice and the second push would 429 against the first. (This does not
# see the scheduled task: do not dispatch a plain run while the morning read
# is under way, or pass not_before.)
concurrency:
  group: burn-line
  cancel-in-progress: false

jobs:
  read:
    # A dry run needs no endpoint; a real one without the repo variable
    # GRID_INGEST_ENDPOINT fails fast, before dialing.
    runs-on: ubuntu-latest
    # Each attempt is bounded by the tool's own -timeout (10m) and a line is
    # tried up to 3 times; this caps the job if something hangs outside a call.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o bin/burn-line ./cmd/burn-line

      # No matrix, and no phone numbers here on purpose. The tool reads
      # grid.burn.lines from prefab.yaml and dials every enabled line, so
      # enabling a county is ONE flag in ONE file. A matrix duplicating those
      # numbers would be a second source of truth that drifts silently in both
      # directions: config-on/CI-off degrades the source with no reading,
      # CI-on/config-off just gets 400s from the endpoint.
      #
      # Lines are independent inside the tool — one being unreachable does not
      # stop the others — and it exits non-zero if ANY failed after its retries,
      # so a single bad line is visible without losing the good ones.
      #
      # A run always dials, so it is the way to force a fresh read, unless it
      # is given not_before: then it skips the lines already read since that
      # time today, as the scheduled task does.
      - name: Read burn lines and push
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TWIML_URL: ${{ secrets.TWILIO_TWIML_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRID_INGEST_TOKEN: ${{ secrets.BURNLINE_INGEST_TOKEN }}
        run: |
          ./bin/burn-line \
            -endpoint="${{ vars.GRID_INGEST_ENDPOINT }}" \
            ${{ inputs.line && format('-line={0}', inputs.line) || '' }} \
            ${{ inputs.dry_run && '-dry-run' || '' }} \
            ${{ inputs.not_before && format('-not-before={0}', inputs.not_before) || '' }}
